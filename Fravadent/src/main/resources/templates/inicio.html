<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Inicio')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container py-4">

        <div class="mb-4">
            <h1 class="h3 fw-bold mb-1">
                Bienvenido a Fravadent <i class="bi bi-capsule-pill text-success"></i>
            </h1>
            <p class="text-muted">Sistema de Gestión de Ventas — accesos rápidos a los módulos principales.</p>
        </div>

        <!-- Accesos rápidos -->
        <div class="row g-3">

            <div class="col-6 col-md-4 col-lg-3">
                <a th:href="@{/producto/listar}" class="text-decoration-none">
                    <div class="card card-resumen h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-box-seam d-block mb-2"></i>
                            <span class="fw-semibold">Productos</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a th:href="@{/venta/registrar}" class="text-decoration-none">
                    <div class="card card-resumen h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-cart-check d-block mb-2"></i>
                            <span class="fw-semibold">Nueva venta</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a th:href="@{/compra/registrar}" class="text-decoration-none">
                    <div class="card card-resumen h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-truck d-block mb-2"></i>
                            <span class="fw-semibold">Nueva compra</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a th:href="@{/cliente/listar}" class="text-decoration-none">
                    <div class="card card-resumen h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-people d-block mb-2"></i>
                            <span class="fw-semibold">Clientes</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a th:href="@{/proveedor/listar}" class="text-decoration-none">
                    <div class="card card-resumen h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-building d-block mb-2"></i>
                            <span class="fw-semibold">Proveedores</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a th:href="@{/despacho/listar}" class="text-decoration-none">
                    <div class="card card-resumen h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-truck-flatbed d-block mb-2"></i>
                            <span class="fw-semibold">Despachos</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a th:href="@{/movimiento_inventario/listar}" class="text-decoration-none">
                    <div class="card card-resumen h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-arrow-left-right d-block mb-2"></i>
                            <span class="fw-semibold">Inventario</span>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a th:href="@{/usuario/listar}" class="text-decoration-none">
                    <div class="card card-resumen h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-person-badge d-block mb-2"></i>
                            <span class="fw-semibold">Usuarios</span>
                        </div>
                    </div>
                </a>
            </div>

        </div>
    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
