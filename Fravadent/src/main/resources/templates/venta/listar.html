<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Ventas')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container-fluid py-4 px-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 fw-bold mb-0">Ventas</h1>
                <p class="text-muted small mb-0">Listado de ventas registradas.</p>
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-success" onclick="exportTableToCSV('ventas.csv')">
                    <i class="bi bi-file-earmark-spreadsheet me-1"></i> Excel (CSV)
                </button>
                <a th:href="@{/venta/registrar}" class="btn btn-login">
                    <i class="bi bi-plus-lg me-1"></i> Nueva venta
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-fravadent table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width:80px">Código</th>
                                <th>N° comprobante</th>
                                <th>Cliente</th>
                                <th>Fecha</th>
                                <th>Método de pago</th>
                                <th>Estado</th>
                                <th class="text-end">Monto total</th>
                                <th style="width:130px" class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${ventas}">
                                <td th:text="${item.codigo}">1</td>
                                <td th:text="${item.nroComprobante}">B001-000001</td>
                                <td th:text="${item.cliente != null} ? (${item.cliente.razonSocial != null and !item.cliente.razonSocial.isEmpty()} ? ${item.cliente.razonSocial} : (${item.cliente.nombres} + ' ' + ${item.cliente.apellidoPaterno})) : '-'">
                                    Cliente
                                </td>
                                <td th:text="${item.fechaHora != null} ? ${#temporals.format(item.fechaHora, 'dd/MM/yyyy HH:mm')} : '-'">-</td>
                                <td th:text="${item.metodoPago != null} ? ${item.metodoPago.nombre} : '-'">Yape</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${item.estadoVenta != null and item.estadoVenta.nombre == 'Pagado'} ? 'bg-success'
                                                           : (${item.estadoVenta != null and item.estadoVenta.nombre == 'Anulado'} ? 'bg-secondary' : 'bg-warning text-dark')"
                                          th:text="${item.estadoVenta != null} ? ${item.estadoVenta.nombre} : '-'">Pendiente</span>
                                </td>
                                <td class="text-end" th:text="${'S/ ' + #numbers.formatDecimal(item.montoTotal, 1, 2)}">S/ 0.00</td>
                                <td class="text-end">
                                    <a th:href="@{/venta/actualizar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${ventas.isEmpty()}">
                                <td colspan="8" class="text-center text-muted py-4">
                                    No hay ventas registradas todavía.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

    <script>
        function exportTableToCSV(filename) {
            let csv = [];
            let rows = document.querySelectorAll("table tr");
            
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                
                if (cols.length === 1 && cols[0].colSpan > 1) continue;
                
                let colCount = cols.length > 0 ? cols.length - 1 : 0; 
                
                for (let j = 0; j < colCount; j++) {
                    let text = cols[j].innerText.replace(/"/g, '""');
                    row.push('"' + text + '"');
                }
                
                if(row.length > 0) csv.push(row.join(","));
            }

            let csvFile = new Blob(["\uFEFF" + csv.join("\n")], { type: "text/csv;charset=utf-8;" });
            let downloadLink = document.createElement("a");
            downloadLink.download = filename;
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
