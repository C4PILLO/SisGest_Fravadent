<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Nueva venta')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container py-4">

        <h1 class="h4 fw-bold mb-3">
            <i class="bi bi-cart-check me-1"></i> Nueva venta
        </h1>

        <form id="formVenta">

            <div class="card border-0 shadow-sm mb-3">
                <div class="card-header bg-white fw-semibold">Datos de la venta</div>
                <div class="card-body">
                    <div class="row g-3">

                        <div class="col-md-4">
                            <label for="nroComprobante" class="form-label small fw-semibold">N° de comprobante</label>
                            <input type="text" class="form-control" id="nroComprobante"
                                   placeholder="Ej: B001-000001" required maxlength="20">
                        </div>

                        <div class="col-md-4">
                            <label for="fechaHora" class="form-label small fw-semibold">Fecha y hora</label>
                            <input type="datetime-local" class="form-control" id="fechaHora" required>
                        </div>

                        <div class="col-md-4">
                            <label for="tipoComprobanteId" class="form-label small fw-semibold">
                                Tipo de comprobante
                            </label>
                            <select class="form-select" id="tipoComprobanteId" required>
                                <option value="">Seleccione...</option>
                                <option th:each="t : ${tipocomprobantes}" th:value="${t.codigo}" th:text="${t.nombre}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="clienteId" class="form-label small fw-semibold">
                                Cliente
                            </label>
                            <select class="form-select" id="clienteId" required>
                                <option value="">Seleccione...</option>
                                <option th:each="c : ${clientes}" th:value="${c.codigo}"
                                        th:text="${c.nombres + ' ' + c.apellidoPaterno}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="metodoPagoId" class="form-label small fw-semibold">
                                Método de pago
                            </label>
                            <select class="form-select" id="metodoPagoId" required>
                                <option value="">Seleccione...</option>
                                <option th:each="m : ${metodopagos}" th:value="${m.codigo}" th:text="${m.nombre}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="estadoVentaId" class="form-label small fw-semibold">
                                Estado
                            </label>
                            <select class="form-select" id="estadoVentaId" required>
                                <option value="">Seleccione...</option>
                                <option th:each="e : ${estadoventas}" th:value="${e.codigo}" th:text="${e.nombre}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="usuarioId" class="form-label small fw-semibold">
                                Usuario que registra
                            </label>
                            <select class="form-select" id="usuarioId" required>
                                <option value="">Seleccione...</option>
                                <option th:each="u : ${usuarios}" th:value="${u.codigo}" th:text="${u.nombres + ' ' + u.apellidoPaterno}"></option>
                            </select>
                        </div>

                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-3">
                <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
                    <span>Detalle de productos</span>
                    <button type="button" class="btn btn-sm btn-login" onclick="agregarFila()">
                        <i class="bi bi-plus-lg me-1"></i> Agregar producto
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-fravadent align-middle mb-0">
                            <thead>
                                <tr>
                                    <th style="width:35%">Producto</th>
                                    <th style="width:15%">Cantidad</th>
                                    <th style="width:20%">Precio unitario (S/)</th>
                                    <th style="width:20%" class="text-end">Subtotal (S/)</th>
                                    <th style="width:10%"></th>
                                </tr>
                            </thead>
                            <tbody id="detalleBody">
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3" class="text-end fw-semibold">Total:</td>
                                    <td class="text-end fw-bold" id="montoTotal">S/ 0.00</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <p class="text-muted small px-3 pb-3 mb-0" id="mensajeVacio">
                        Todavía no agregas productos. Click en "Agregar producto".
                    </p>
                </div>
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <a th:href="@{/venta/listar}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-check-lg me-1"></i> Registrar venta
                </button>
            </div>

        </form>

    </main>

    <div id="productoTemplateContainer" style="display: none;">
        <select class="form-select form-select-sm" data-field="producto" onchange="seleccionarProducto(this)" required>
            <option value="" data-precio="0">Seleccione producto...</option>
            <option th:each="prod : ${productos}" th:value="${prod.codigo}" th:data-precio="${prod.precioVenta}" th:text="${prod.nombreDescripcion}"></option>
        </select>
    </div>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const URL_TRANSACCIONAL = /*[[@{/venta/transaccional}]]*/ '/fravadent/venta/transaccional';
        const URL_LISTAR = /*[[@{/venta/listar}]]*/ '/fravadent/venta/listar';
        const CSRF_TOKEN = /*[[${_csrf.token}]]*/ '';
        const CSRF_HEADER = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
        /*]]>*/

        let contadorFila = 0;

        function actualizarMensajeVacio() {
            const filas = document.querySelectorAll('#detalleBody tr').length;
            document.getElementById('mensajeVacio').style.display = filas === 0 ? 'block' : 'none';
        }

        function seleccionarProducto(selectElement) {
            const precio = selectElement.options[selectElement.selectedIndex].dataset.precio;
            const tr = selectElement.closest('tr');
            const inputPrecio = tr.querySelector('[data-field="precio"]');
            if (precio) {
                inputPrecio.value = parseFloat(precio).toFixed(2);
                calcularTotales();
            }
        }

        function agregarFila() {
            contadorFila++;
            const tbody = document.getElementById('detalleBody');
            const tr = document.createElement('tr');
            const productoSelectHtml = document.getElementById('productoTemplateContainer').innerHTML;
            
            tr.innerHTML = `
                <td>${productoSelectHtml}</td>
                <td><input type="number" class="form-control form-control-sm" data-field="cantidad" min="1" value="1" required></td>
                <td><input type="number" step="0.01" min="0" class="form-control form-control-sm" data-field="precio" required></td>
                <td class="text-end"><span data-field="subtotal">0.00</span></td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove(); calcularTotales();">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
            tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', calcularTotales));
            actualizarMensajeVacio();
        }

        function calcularTotales() {
            let total = 0;
            document.querySelectorAll('#detalleBody tr').forEach(tr => {
                const cantidad = parseFloat(tr.querySelector('[data-field="cantidad"]').value) || 0;
                const precio = parseFloat(tr.querySelector('[data-field="precio"]').value) || 0;
                const subtotal = cantidad * precio;
                tr.querySelector('[data-field="subtotal"]').textContent = subtotal.toFixed(2);
                total += subtotal;
            });
            document.getElementById('montoTotal').textContent = 'S/ ' + total.toFixed(2);
            actualizarMensajeVacio();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const ahora = new Date();
            ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
            document.getElementById('fechaHora').value = ahora.toISOString().slice(0, 16);
        });

        document.getElementById('formVenta').addEventListener('submit', async function (e) {
            e.preventDefault();

            const filas = document.querySelectorAll('#detalleBody tr');
            if (filas.length === 0) {
                alert('Agrega al menos un producto al detalle.');
                return;
            }

            const detalles = [];
            let total = 0;
            for (const tr of filas) {
                const producto = parseInt(tr.querySelector('[data-field="producto"]').value);
                const cantidad = parseInt(tr.querySelector('[data-field="cantidad"]').value);
                const precio = parseFloat(tr.querySelector('[data-field="precio"]').value);
                if (!producto || !cantidad || isNaN(precio)) {
                    alert('Revisa que todas las filas del detalle tengan producto, cantidad y precio.');
                    return;
                }
                const subtotal = cantidad * precio;
                total += subtotal;
                detalles.push({
                    producto: { codigo: producto },
                    cantidad: cantidad,
                    precioUnitario: precio,
                    subtotal: subtotal
                });
            }

            const payload = {
                venta: {
                    nroComprobante: document.getElementById('nroComprobante').value,
                    fechaHora: document.getElementById('fechaHora').value,
                    tipoComprobante: { codigo: parseInt(document.getElementById('tipoComprobanteId').value) },
                    cliente: { codigo: parseInt(document.getElementById('clienteId').value) },
                    metodoPago: { codigo: parseInt(document.getElementById('metodoPagoId').value) },
                    estadoVenta: { codigo: parseInt(document.getElementById('estadoVentaId').value) },
                    usuario: { codigo: parseInt(document.getElementById('usuarioId').value) },
                    montoTotal: total
                },
                detalles: detalles
            };

            try {
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (CSRF_HEADER && CSRF_TOKEN) {
                    headers[CSRF_HEADER] = CSRF_TOKEN;
                }

                const resp = await fetch(URL_TRANSACCIONAL, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });
                if (resp.ok) {
                    window.location.href = URL_LISTAR;
                } else {
                    const err = await resp.text();
                    alert('No se pudo registrar la venta:\n' + err);
                }
            } catch (err) {
                alert('Error de conexión: ' + err);
            }
        });
    </script>

</body>
</html>
