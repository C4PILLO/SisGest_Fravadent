<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Anular / Habilitar ventas')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container-fluid py-4 px-4">

        <!--
          PENDIENTE (backend): esta vista usa las rutas genéricas /habilitar/{id} y
          /deshabilitar/{id}, que dependen del campo "estado" fantasma (bug ya
          reportado). Además, semánticamente "anular una venta" probablemente
          debería cambiar estadoVenta a "Anulado" (ya existe ese estado en la
          tabla estado_venta), no un flag aparte de activo/inactivo. Vale la pena
          que el equipo decida si:
            a) arreglan el campo "estado" y lo usan tal cual (como está ahora), o
            b) quitan "estado" y hacen que estos botones cambien estadoVenta.
          La vista funciona igual en ambos casos, cambiaría solo la ruta de destino.
        -->

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 fw-bold mb-0">Anular / Habilitar ventas</h1>
                <p class="text-muted small mb-0">Aquí ves todas las ventas, activas e inactivas.</p>
            </div>
            <a th:href="@{/venta/listar}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Volver al listado
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-fravadent table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width:80px">Código</th>
                                <th>N° comprobante</th>
                                <th>Cliente</th>
                                <th class="text-end">Monto total</th>
                                <th style="width:120px">Estado</th>
                                <th style="width:160px" class="text-end">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${ventas}">
                                <td th:text="${item.codigo}">1</td>
                                <td th:text="${item.nroComprobante}">B001-000001</td>
                                <td th:text="${item.cliente != null} ? (${item.cliente.nombres} + ' ' + ${item.cliente.apellidoPaterno}) : '-'">Cliente</td>
                                <td class="text-end" th:text="${'S/ ' + #numbers.formatDecimal(item.montoTotal, 1, 2)}">S/ 0.00</td>
                                <td>
                                    <span th:if="${item.estado == 'A'}" class="badge bg-success">Activo</span>
                                    <span th:unless="${item.estado == 'A'}" class="badge bg-secondary">Inactivo</span>
                                </td>
                                <td class="text-end">
                                    <a th:if="${item.estado == 'A'}"
                                       th:href="@{/venta/deshabilitar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-x-circle me-1"></i> Anular
                                    </a>
                                    <a th:unless="${item.estado == 'A'}"
                                       th:href="@{/venta/habilitar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-success">
                                        <i class="bi bi-check-circle me-1"></i> Reactivar
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${ventas.isEmpty()}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    No hay ventas registradas todavía.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
