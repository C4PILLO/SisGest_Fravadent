<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Editar unidad de medida')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container py-4">

        <h1 class="h4 fw-bold mb-3">
            <i class="bi bi-pencil-square me-1"></i> Editar unidad de medida
        </h1>

        <div class="card border-0 shadow-sm" style="max-width:500px;">
            <div class="card-body p-4">

                <form th:action="@{/unidad_medida/actualizar/{id}(id=${unidadmedida.codigo})}"
                      th:object="${unidadmedida}" method="post">

                    <div class="mb-1">
                        <span class="text-muted small">Código: <span th:text="${unidadmedida.codigo}">0</span></span>
                    </div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label small fw-semibold">Nombre</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                               required maxlength="50">
                    </div>

                    <div class="mb-3">
                        <label for="abreviatura" class="form-label small fw-semibold">Abreviatura</label>
                        <input type="text" class="form-control" id="abreviatura" th:field="*{abreviatura}"
                               required maxlength="10">
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a th:href="@{/unidad_medida/listar}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-login">
                            <i class="bi bi-check-lg me-1"></i> Guardar cambios
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
