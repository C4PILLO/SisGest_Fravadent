<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Editar compra')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container py-4">

        <h1 class="h4 fw-bold mb-3">
            <i class="bi bi-pencil-square me-1"></i> Editar compra
        </h1>

        <div class="alert alert-info small mb-3" style="max-width:600px;">
            <i class="bi bi-info-circle me-1"></i>
            Esta vista solo edita los datos generales de la compra, no el detalle de productos.
        </div>

        <div class="card border-0 shadow-sm" style="max-width:600px;">
            <div class="card-body p-4">

                <div class="mb-2">
                    <span class="text-muted small">Código: <span th:text="${compra.codigo}">0</span></span>
                </div>

                <form th:action="@{/compra/actualizar/{id}(id=${compra.codigo})}" th:object="${compra}" method="post">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="fechaHora" class="form-label small fw-semibold">Fecha y hora</label>
                            <input type="datetime-local" class="form-control" id="fechaHora" th:field="*{fechaHora}" required>
                        </div>

                        <div class="col-md-6">
                            <label for="montoTotal" class="form-label small fw-semibold">Monto total (S/)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="montoTotal"
                                   th:field="*{montoTotal}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Proveedor</label>
                            <select class="form-select" th:field="*{proveedor.codigo}" required>
                                <option th:each="p : ${proveedors}" th:value="${p.codigo}" th:text="${p.razonSocial}"
                                        th:selected="${compra.proveedor != null and p.codigo == compra.proveedor.codigo}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Usuario que registró</label>
                            <select class="form-select" th:field="*{usuario.codigo}" required>
                                <option th:each="u : ${usuarios}" th:value="${u.codigo}"
                                        th:text="${u.nombres + ' ' + u.apellidoPaterno}"
                                        th:selected="${compra.usuario != null and u.codigo == compra.usuario.codigo}"></option>
                            </select>
                        </div>

                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a th:href="@{/compra/listar}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-login">
                            <i class="bi bi-check-lg me-1"></i> Guardar cambios
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
