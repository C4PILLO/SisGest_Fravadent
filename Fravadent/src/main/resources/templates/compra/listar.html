<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Compras')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container-fluid py-4 px-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 fw-bold mb-0">Compras</h1>
                <p class="text-muted small mb-0">Listado de compras activas.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/compra/habilitar_vista}" class="btn btn-outline-secondary">
                    <i class="bi bi-toggle2-on me-1"></i> Habilitar / Deshabilitar
                </a>
                <a th:href="@{/compra/registrar}" class="btn btn-login">
                    <i class="bi bi-plus-lg me-1"></i> Nueva compra
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-fravadent table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width:80px">Código</th>
                                <th>Proveedor</th>
                                <th>Fecha</th>
                                <th>Registrado por</th>
                                <th class="text-end">Monto total</th>
                                <th style="width:100px" class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${compras}">
                                <td th:text="${item.codigo}">1</td>
                                <td th:text="${item.proveedor != null} ? ${item.proveedor.razonSocial} : '-'">Proveedor</td>
                                <td th:text="${item.fechaHora != null} ? ${#temporals.format(item.fechaHora, 'dd/MM/yyyy HH:mm')} : '-'">-</td>
                                <td th:text="${item.usuario != null} ? (${item.usuario.nombres} + ' ' + ${item.usuario.apellidoPaterno}) : '-'">Usuario</td>
                                <td class="text-end" th:text="${'S/ ' + #numbers.formatDecimal(item.montoTotal, 1, 2)}">S/ 0.00</td>
                                <td class="text-end">
                                    <a th:href="@{/compra/actualizar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${compras.isEmpty()}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    No hay compras registradas todavía.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
