<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Habilitar categorías')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 fw-bold mb-0">Habilitar / Deshabilitar categorías</h1>
                <p class="text-muted small mb-0">Aquí ves todas las categorías, activas e inactivas.</p>
            </div>
            <a th:href="@{/categoria_producto/listar}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Volver al listado
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-fravadent table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th style="width:100px">Código</th>
                            <th>Nombre</th>
                            <th style="width:120px">Estado</th>
                            <th style="width:160px" class="text-end">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${categorias}">
                            <td th:text="${item.codigo}">1</td>
                            <td th:text="${item.nombre}">Nombre categoría</td>
                            <td>
                                <span th:if="${item.estado == 'A'}" class="badge bg-success">Activo</span>
                                <span th:unless="${item.estado == 'A'}" class="badge bg-secondary">Inactivo</span>
                            </td>
                            <td class="text-end">
                                <a th:if="${item.estado == 'A'}"
                                   th:href="@{/categoria_producto/deshabilitar/{id}(id=${item.codigo})}"
                                   class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-toggle-off me-1"></i> Deshabilitar
                                </a>
                                <a th:unless="${item.estado == 'A'}"
                                   th:href="@{/categoria_producto/habilitar/{id}(id=${item.codigo})}"
                                   class="btn btn-sm btn-outline-success">
                                    <i class="bi bi-toggle-on me-1"></i> Habilitar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${categorias.isEmpty()}">
                            <td colspan="4" class="text-center text-muted py-4">
                                No hay categorías registradas todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
