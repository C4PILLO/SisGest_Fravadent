<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Movimientos de Inventario')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container-fluid py-4 px-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 fw-bold mb-0">Movimientos de Inventario</h1>
                <p class="text-muted small mb-0">Historial de entradas y salidas de stock.</p>
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-success" onclick="exportTableToCSV('movimientos_inventario.csv')">
                    <i class="bi bi-file-earmark-spreadsheet me-1"></i> Excel (CSV)
                </button>
                <a th:href="@{/movimiento_inventario/registrar}" class="btn btn-login">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo movimiento
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-fravadent table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width:80px">Código</th>
                                <th>Producto</th>
                                <th>Tipo</th>
                                <th class="text-end">Cantidad</th>
                                <th>Fecha</th>
                                <th>Referencia</th>
                                <th>Usuario</th>
                                <th style="width:100px" class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${movimientoinventarios}">
                                <td th:text="${item.codigo}">1</td>
                                <td th:text="${item.producto != null} ? ${item.producto.nombreDescripcion} : '-'">Producto</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${item.tipoMovimiento != null and item.tipoMovimiento.nombre == 'Entrada'} ? 'bg-success' : 'bg-danger'"
                                          th:text="${item.tipoMovimiento != null} ? ${item.tipoMovimiento.nombre} : '-'">Entrada</span>
                                </td>
                                <td class="text-end" th:text="${item.cantidad}">0</td>
                                <td th:text="${item.fechaHora != null} ? ${#temporals.format(item.fechaHora, 'dd/MM/yyyy HH:mm')} : '-'">-</td>
                                <td th:text="${item.referenciaTipo != null and item.referenciaTipo != ''} ? (${item.referenciaTipo} + (${item.referenciaId != null} ? (' #' + ${item.referenciaId}) : '')) : '-'">-</td>
                                <td th:text="${item.usuario != null} ? (${item.usuario.nombres} + ' ' + ${item.usuario.apellidoPaterno}) : '-'">Usuario</td>
                                <td class="text-end">
                                    <a th:href="@{/movimiento_inventario/actualizar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/movimiento_inventario/eliminar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-danger ms-1" title="Eliminar"
                                       onclick="return confirm('¿Está seguro de eliminar este movimiento físico?');">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${movimientoinventarios.isEmpty()}">
                                <td colspan="8" class="text-center text-muted py-4">
                                    No hay movimientos registrados todavía.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

    <script>
        function exportTableToCSV(filename) {
            let csv = [];
            let rows = document.querySelectorAll("table tr");
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                if (cols.length === 1 && cols[0].colSpan > 1) continue;
                let colCount = cols.length > 0 ? cols.length - 1 : 0; 
                for (let j = 0; j < colCount; j++) {
                    let text = cols[j].innerText.replace(/"/g, '""');
                    row.push('"' + text + '"');
                }
                if(row.length > 0) csv.push(row.join(","));
            }
            let csvFile = new Blob(["\uFEFF" + csv.join("\n")], { type: "text/csv;charset=utf-8;" });
            let downloadLink = document.createElement("a");
            downloadLink.download = filename;
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
