<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Movimientos de Inventario')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container-fluid py-4 px-4">

        <!--
          PENDIENTE (backend): igual que en despacho, MovimientoInventarioEntity tiene
          un campo "estado" que no existe como columna en la tabla real, y
          findAllCustom() filtra por él — este módulo no va a funcionar hasta resolverlo.
          De paso: un movimiento de inventario ya ocurrido probablemente no necesite
          "deshabilitarse" — evaluar si el campo estado debería existir aquí siquiera.
        -->

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 fw-bold mb-0">Movimientos de Inventario</h1>
                <p class="text-muted small mb-0">Historial de entradas y salidas de stock.</p>
            </div>
            <a th:href="@{/movimiento_inventario/registrar}" class="btn btn-login">
                <i class="bi bi-plus-lg me-1"></i> Nuevo movimiento
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-fravadent table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width:80px">Código</th>
                                <th>Producto</th>
                                <th>Tipo</th>
                                <th class="text-end">Cantidad</th>
                                <th>Fecha</th>
                                <th>Referencia</th>
                                <th>Usuario</th>
                                <th style="width:100px" class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${movimientoinventarios}">
                                <td th:text="${item.codigo}">1</td>
                                <td th:text="${item.producto != null} ? ${item.producto.nombreDescripcion} : '-'">Producto</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${item.tipoMovimiento != null and item.tipoMovimiento.nombre == 'Entrada'} ? 'bg-success' : 'bg-danger'"
                                          th:text="${item.tipoMovimiento != null} ? ${item.tipoMovimiento.nombre} : '-'">Entrada</span>
                                </td>
                                <td class="text-end" th:text="${item.cantidad}">0</td>
                                <td th:text="${item.fechaHora != null} ? ${#temporals.format(item.fechaHora, 'dd/MM/yyyy HH:mm')} : '-'">-</td>
                                <td th:text="${item.referenciaTipo != null} ? (${item.referenciaTipo} + ' #' + ${item.referenciaId}) : '-'">-</td>
                                <td th:text="${item.usuario != null} ? (${item.usuario.nombres} + ' ' + ${item.usuario.apellidoPaterno}) : '-'">Usuario</td>
                                <td class="text-end">
                                    <a th:href="@{/movimiento_inventario/actualizar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${movimientoinventarios.isEmpty()}">
                                <td colspan="8" class="text-center text-muted py-4">
                                    No hay movimientos registrados todavía.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
