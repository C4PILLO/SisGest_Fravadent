<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Tipo de Despacho')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 fw-bold mb-0">Tipo de Despacho</h1>
                <p class="text-muted small mb-0">Listado de tipos de despacho activos.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/tipo_despacho/habilitar_vista}" class="btn btn-outline-secondary">
                    <i class="bi bi-toggle2-on me-1"></i> Habilitar / Deshabilitar
                </a>
                <a th:href="@{/tipo_despacho/registrar}" class="btn btn-login">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo tipo de despacho
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <table class="table table-fravadent table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th style="width:100px">Código</th>
                            <th>Nombre</th>
                            <th style="width:120px">Estado</th>
                            <th style="width:100px" class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${tipodespachos}">
                            <td th:text="${item.codigo}">1</td>
                            <td th:text="${item.nombre}">Nombre</td>
                            <td>
                                <span class="badge bg-success">Activo</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/tipo_despacho/actualizar/{id}(id=${item.codigo})}"
                                   class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${tipodespachos.isEmpty()}">
                            <td colspan="4" class="text-center text-muted py-4">
                                No hay registros todavía.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
