<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Iniciar sesión')}"></head>

<body class="login-body">

    <div class="login-wrapper d-flex align-items-center justify-content-center">
        <div class="card login-card shadow-lg border-0">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <i class="bi bi-capsule-pill login-icon"></i>
                    <h1 class="h4 fw-bold mt-2 mb-0">Fravadent</h1>
                    <p class="text-muted small mb-0">Sistema de Gestión de Ventas</p>
                </div>

                <!-- Mensaje: credenciales inválidas -->
                <div th:if="${param.error != null}" class="alert alert-danger py-2 small" role="alert">
                    <i class="bi bi-exclamation-triangle me-1"></i>
                    Usuario o contraseña incorrectos.
                </div>

                <!-- Mensaje: sesión cerrada correctamente -->
                <div th:if="${param.logout != null}" class="alert alert-success py-2 small" role="alert">
                    <i class="bi bi-check-circle me-1"></i>
                    Sesión cerrada correctamente.
                </div>

                <form th:action="@{/login}" method="post">

                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Ingresa tu usuario" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Ingresa tu contraseña" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login w-100 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                    </button>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
