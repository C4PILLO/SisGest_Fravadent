<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Nuevo producto')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container py-4">

        <h1 class="h4 fw-bold mb-3">
            <i class="bi bi-plus-circle me-1"></i> Nuevo producto
        </h1>

        <!--
          PENDIENTE (backend): los 3 <select> de abajo (Categoría, Marca, Unidad de medida)
          necesitan que ProductoController sobrescriba cargarCombos() agregando al Model:
            "categorias"    -> List<CategoriaDTO>    (ya usado igual en /categoria_producto)
            "marcas"        -> List<MarcaDTO>        (ya usado igual en /marca)
            "unidadmedidas" -> List<UnidadMedidaDTO>  (ya usado igual en /unidad_medida)
          Mientras tanto, dejo un campo deshabilitado de aviso en su lugar y el <select>
          real comentado, listo para descomentar apenas el combo exista en el Model.
        -->

        <div class="card border-0 shadow-sm" style="max-width:700px;">
            <div class="card-body p-4">

                <form th:action="@{/producto/registrar}" th:object="${producto}" method="post">

                    <div class="row g-3">

                        <div class="col-md-4">
                            <label for="codigoSku" class="form-label small fw-semibold">SKU</label>
                            <input type="text" class="form-control" id="codigoSku" th:field="*{codigoSku}"
                                   placeholder="Ej: PROD-0001" required maxlength="60">
                        </div>

                        <div class="col-md-8">
                            <label for="nombreDescripcion" class="form-label small fw-semibold">Nombre / Descripción</label>
                            <input type="text" class="form-control" id="nombreDescripcion" th:field="*{nombreDescripcion}"
                                   placeholder="Ej: Kit de resina compuesta A2" required maxlength="300">
                        </div>

                        <!-- Categoría -->
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Categoría</label>
                            <input type="text" class="form-control" disabled placeholder="Pendiente de combo (backend)">
                            <!--
                            <select class="form-select" th:field="*{categoria.codigo}" required>
                                <option value="">Seleccione...</option>
                                <option th:each="c : ${categorias}" th:value="${c.codigo}" th:text="${c.nombre}"></option>
                            </select>
                            -->
                        </div>

                        <!-- Marca -->
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Marca</label>
                            <input type="text" class="form-control" disabled placeholder="Pendiente de combo (backend)">
                            <!--
                            <select class="form-select" th:field="*{marca.codigo}" required>
                                <option value="">Seleccione...</option>
                                <option th:each="m : ${marcas}" th:value="${m.codigo}" th:text="${m.nombre}"></option>
                            </select>
                            -->
                        </div>

                        <!-- Unidad de medida -->
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Unidad de medida</label>
                            <input type="text" class="form-control" disabled placeholder="Pendiente de combo (backend)">
                            <!--
                            <select class="form-select" th:field="*{unidadMedida.codigo}" required>
                                <option value="">Seleccione...</option>
                                <option th:each="u : ${unidadmedidas}" th:value="${u.codigo}" th:text="${u.nombre}"></option>
                            </select>
                            -->
                        </div>

                        <div class="col-md-3">
                            <label for="precioCompra" class="form-label small fw-semibold">Precio compra (S/)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="precioCompra"
                                   th:field="*{precioCompra}" required>
                        </div>

                        <div class="col-md-3">
                            <label for="precioVenta" class="form-label small fw-semibold">Precio venta (S/)</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="precioVenta"
                                   th:field="*{precioVenta}" required>
                        </div>

                        <div class="col-md-3">
                            <label for="stockActual" class="form-label small fw-semibold">Stock actual</label>
                            <input type="number" min="0" class="form-control" id="stockActual"
                                   th:field="*{stockActual}" required>
                        </div>

                        <div class="col-md-3">
                            <label for="stockMinimo" class="form-label small fw-semibold">Stock mínimo</label>
                            <input type="number" min="0" class="form-control" id="stockMinimo"
                                   th:field="*{stockMinimo}" required>
                        </div>

                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a th:href="@{/producto/listar}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-login">
                            <i class="bi bi-check-lg me-1"></i> Guardar
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
