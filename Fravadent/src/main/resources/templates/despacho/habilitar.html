<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Habilitar despachos')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container-fluid py-4 px-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 fw-bold mb-0">Habilitar / Deshabilitar despachos</h1>
                <p class="text-muted small mb-0">Aquí ves todos los despachos, activos e inactivos.</p>
            </div>
            <a th:href="@{/despacho/listar}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Volver al listado
            </a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-fravadent table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width:80px">Código</th>
                                <th>N° comprobante</th>
                                <th>Tipo</th>
                                <th style="width:120px">Estado (activo)</th>
                                <th style="width:160px" class="text-end">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${despachos}">
                                <td th:text="${item.codigo}">1</td>
                                <td th:text="${item.venta != null} ? ${item.venta.nroComprobante} : '-'">B001-000001</td>
                                <td th:text="${item.tipoDespacho != null} ? ${item.tipoDespacho.nombre} : '-'">Delivery</td>
                                <td>
                                    <span th:if="${item.estado == 'A'}" class="badge bg-success">Activo</span>
                                    <span th:unless="${item.estado == 'A'}" class="badge bg-secondary">Inactivo</span>
                                </td>
                                <td class="text-end">
                                    <a th:if="${item.estado == 'A'}"
                                       th:href="@{/despacho/deshabilitar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-toggle-off me-1"></i> Deshabilitar
                                    </a>
                                    <a th:unless="${item.estado == 'A'}"
                                       th:href="@{/despacho/habilitar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-success">
                                        <i class="bi bi-toggle-on me-1"></i> Habilitar
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${despachos.isEmpty()}">
                                <td colspan="5" class="text-center text-muted py-4">
                                    No hay despachos registrados todavía.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
