<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Proveedores')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container-fluid py-4 px-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 fw-bold mb-0">Proveedores</h1>
                <p class="text-muted small mb-0">Listado de proveedores.</p>
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-success" onclick="exportTableToCSV('proveedores.csv')">
                    <i class="bi bi-file-earmark-spreadsheet me-1"></i> Excel (CSV)
                </button>
                <a th:href="@{/proveedor/habilitar_vista}" class="btn btn-outline-secondary">
                    <i class="bi bi-toggle2-on me-1"></i> Habilitar / Deshabilitar
                </a>
                <a th:href="@{/proveedor/registrar}" class="btn btn-login">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo proveedor
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-fravadent table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width:80px">Código</th>
                                <th>RUC</th>
                                <th>Razón Social</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Distrito</th>
                                <th style="width:100px" class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${proveedors}">
                                <td th:text="${item.codigo}">1</td>
                                <td th:text="${item.ruc}">20000000000</td>
                                <td th:text="${item.razonSocial}">Razón Social</td>
                                <td th:text="${item.telefono}">123456789</td>
                                <td th:text="${item.email}">email@example.com</td>
                                <td th:text="${item.distrito != null} ? ${item.distrito.nombre} : '-'">Distrito</td>
                                <td class="text-end">
                                    <a th:href="@{/proveedor/actualizar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${proveedors.isEmpty()}">
                                <td colspan="8" class="text-center text-muted py-4">
                                    No hay proveedores registrados todavía.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

    <script>
        function exportTableToCSV(filename) {
            let csv = [];
            let rows = document.querySelectorAll("table tr");
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                if (cols.length === 1 && cols[0].colSpan > 1) continue;
                let colCount = cols.length > 0 ? cols.length - 1 : 0; 
                for (let j = 0; j < colCount; j++) {
                    let text = cols[j].innerText.replace(/"/g, '""');
                    row.push('"' + text + '"');
                }
                if(row.length > 0) csv.push(row.join(","));
            }
            let csvFile = new Blob(["\uFEFF" + csv.join("\n")], { type: "text/csv;charset=utf-8;" });
            let downloadLink = document.createElement("a");
            downloadLink.download = filename;
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
