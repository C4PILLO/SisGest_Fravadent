<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Nuevo proveedor')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container py-4">

        <h1 class="h4 fw-bold mb-3">
            <i class="bi bi-plus-circle me-1"></i> Nuevo proveedor
        </h1>

        <div class="card border-0 shadow-sm" style="max-width:700px;">
            <div class="card-body p-4">

                <form th:action="@{/proveedor/registrar}" th:object="${proveedor}" method="post">

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="ruc" class="form-label small fw-semibold">RUC</label>
                            <input type="text" class="form-control" id="ruc" th:field="*{ruc}" required maxlength="11">
                        </div>

                        <div class="col-md-8">
                            <label for="razonSocial" class="form-label small fw-semibold">Razón Social</label>
                            <input type="text" class="form-control" id="razonSocial" th:field="*{razonSocial}" required maxlength="100">
                        </div>


                        <div class="col-md-6">
                            <label for="telefono" class="form-label small fw-semibold">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" th:field="*{telefono}" maxlength="20">
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label small fw-semibold">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" maxlength="100">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Distrito</label>
                            <select class="form-select" th:field="*{distrito.codigo}" required>
                                <option value="">Seleccione...</option>
                                <option th:each="d : ${distritos}" th:value="${d.codigo}" th:text="${d.nombre}"></option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="direccion" class="form-label small fw-semibold">Dirección</label>
                            <input type="text" class="form-control" id="direccion" th:field="*{direccion}" maxlength="150">
                        </div>

                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a th:href="@{/proveedor/listar}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-login">
                            <i class="bi bi-check-lg me-1"></i> Guardar
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
