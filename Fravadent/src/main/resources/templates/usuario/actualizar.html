<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Editar usuario')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container py-4">

        <h1 class="h4 fw-bold mb-3">
            <i class="bi bi-pencil-square me-1"></i> Editar usuario
        </h1>

        <!--
          PENDIENTE (backend) — 2 bloqueos distintos:

          1) Combos: cargarCombos() en UsuarioController debe agregar al Model:
               "tipodocumentos" -> List<TipoDocumentoDTO>
               "sexos"          -> List<SexoDTO>
               "distritos"      -> List<DistritoDTO>
             Los <select> reales están comentados más abajo, listos para descomentar.

          2) Más grave: UsuarioDTO NO tiene los campos "username", "password" y "rol",
             aunque en la base son NOT NULL (y username es UNIQUE). Sin esos 3 campos
             en el DTO, este formulario no puede crear un usuario con credenciales de
             login. Falta agregarlos al DTO (el password debe encriptarse con
             GenerarEncriptacion antes de guardar, en el service). No agrego esos
             campos al formulario todavía porque no existe dónde recibirlos del
             lado del servidor.
        -->

        <div class="card border-0 shadow-sm" style="max-width:700px;">
            <div class="card-body p-4">

                <div class="alert alert-warning small mb-3">
                    <i class="bi bi-exclamation-triangle me-1"></i>
                    Este formulario todavía no puede editar usuario/clave de acceso —
                    falta que el DTO soporte esos campos. Ver comentario en el código fuente.
                </div>

                <div class="mb-2">
                    <span class="text-muted small">Código: <span th:text="${usuario.codigo}">0</span></span>
                </div>

                <form th:action="@{/usuario/actualizar/{id}(id=${usuario.codigo})}" th:object="${usuario}" method="post">

                    <div class="row g-3">

                        <!-- Tipo de documento -->
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Tipo de documento</label>
                            <input type="text" class="form-control" disabled
                                   th:value="${usuario.tipoDocumento != null} ? ${usuario.tipoDocumento.nombre} : ''"
                                   placeholder="Pendiente de combo (backend)">
                            <!--
                            <select class="form-select" th:field="*{tipoDocumento.codigo}" required>
                                <option th:each="t : ${tipodocumentos}" th:value="${t.codigo}" th:text="${t.nombre}"
                                        th:selected="${usuario.tipoDocumento != null and t.codigo == usuario.tipoDocumento.codigo}"></option>
                            </select>
                            -->
                        </div>

                        <div class="col-md-8">
                            <label for="numeroDocumento" class="form-label small fw-semibold">N° de documento</label>
                            <input type="text" class="form-control" id="numeroDocumento" th:field="*{numeroDocumento}"
                                   required maxlength="20">
                        </div>

                        <div class="col-md-4">
                            <label for="nombres" class="form-label small fw-semibold">Nombres</label>
                            <input type="text" class="form-control" id="nombres" th:field="*{nombres}"
                                   required maxlength="80">
                        </div>

                        <div class="col-md-4">
                            <label for="apellidoPaterno" class="form-label small fw-semibold">Apellido paterno</label>
                            <input type="text" class="form-control" id="apellidoPaterno" th:field="*{apellidoPaterno}"
                                   required maxlength="50">
                        </div>

                        <div class="col-md-4">
                            <label for="apellidoMaterno" class="form-label small fw-semibold">Apellido materno</label>
                            <input type="text" class="form-control" id="apellidoMaterno" th:field="*{apellidoMaterno}"
                                   required maxlength="50">
                        </div>

                        <!-- Sexo -->
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Sexo</label>
                            <input type="text" class="form-control" disabled
                                   th:value="${usuario.sexo != null} ? ${usuario.sexo.nombre} : ''"
                                   placeholder="Pendiente de combo (backend)">
                            <!--
                            <select class="form-select" th:field="*{sexo.codigo}" required>
                                <option th:each="s : ${sexos}" th:value="${s.codigo}" th:text="${s.nombre}"
                                        th:selected="${usuario.sexo != null and s.codigo == usuario.sexo.codigo}"></option>
                            </select>
                            -->
                        </div>

                        <div class="col-md-4">
                            <label for="telefono" class="form-label small fw-semibold">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" th:field="*{telefono}" maxlength="20">
                        </div>

                        <div class="col-md-4">
                            <label for="email" class="form-label small fw-semibold">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}" maxlength="100">
                        </div>

                        <div class="col-md-8">
                            <label for="direccion" class="form-label small fw-semibold">Dirección</label>
                            <input type="text" class="form-control" id="direccion" th:field="*{direccion}" maxlength="150">
                        </div>

                        <!-- Distrito -->
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Distrito</label>
                            <input type="text" class="form-control" disabled
                                   th:value="${usuario.distrito != null} ? ${usuario.distrito.nombre} : ''"
                                   placeholder="Pendiente de combo (backend)">
                            <!--
                            <select class="form-select" th:field="*{distrito.codigo}" required>
                                <option th:each="d : ${distritos}" th:value="${d.codigo}" th:text="${d.nombre}"
                                        th:selected="${usuario.distrito != null and d.codigo == usuario.distrito.codigo}"></option>
                            </select>
                            -->
                        </div>

                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a th:href="@{/usuario/listar}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-login">
                            <i class="bi bi-check-lg me-1"></i> Guardar
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
