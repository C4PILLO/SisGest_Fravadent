<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head('Usuarios')}"></head>

<body>
    <nav th:replace="~{layout/base :: navbar}"></nav>

    <main class="container-fluid py-4 px-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="h4 fw-bold mb-0">Usuarios</h1>
                <p class="text-muted small mb-0">Listado de usuarios activos.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/usuario/habilitar_vista}" class="btn btn-outline-secondary">
                    <i class="bi bi-toggle2-on me-1"></i> Habilitar / Deshabilitar
                </a>
                <a th:href="@{/usuario/registrar}" class="btn btn-login">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo usuario
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-fravadent table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width:80px">Código</th>
                                <th>Nombres y apellidos</th>
                                <th>Documento</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Distrito</th>
                                <th style="width:100px" class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${usuarios}">
                                <td th:text="${item.codigo}">1</td>
                                <td th:text="${item.nombres + ' ' + item.apellidoPaterno + ' ' + item.apellidoMaterno}">Nombre completo</td>
                                <td>
                                    <span th:if="${item.tipoDocumento != null}" th:text="${item.tipoDocumento.abreviatura}">DNI</span>
                                    <span th:text="${item.numeroDocumento}">00000000</span>
                                </td>
                                <td th:text="${item.telefono ?: '-'}">-</td>
                                <td th:text="${item.email ?: '-'}">-</td>
                                <td th:text="${item.distrito != null} ? ${item.distrito.nombre} : '-'">Distrito</td>
                                <td class="text-end">
                                    <a th:href="@{/usuario/actualizar/{id}(id=${item.codigo})}"
                                       class="btn btn-sm btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${usuarios.isEmpty()}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    No hay usuarios registrados todavía.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/base :: footer}"></footer>
    <th:block th:replace="~{layout/base :: scripts}"></th:block>

</body>
</html>
